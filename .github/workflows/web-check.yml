name: Web CI and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Grant permissions required to publish to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # JOB 1: Continuous Integration (Test your code)
  validate-web-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Check HTML structure
        run: |
          test -f index.html
          grep -q "<h1>" index.html

      - name: Check CSS file
        run: test -s style.css

  # JOB 2: Continuous Deployment (Publish if Job 1 passes)
  deploy-website:
    needs: validate-web-files
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Package website files
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
